name: Nightly Data Refresh

on:
  schedule:
    # Runs at 11:30 AM UTC = 7:30 AM EDT (Eastern Daylight Time, UTC-4, Apr–Nov)
    # Note: GitHub Actions cron uses UTC only and does not adjust for daylight saving.
    # During EST (UTC-5, Nov–Mar) this will run at 6:30 AM ET instead.
    - cron: '30 11 * * *'
  workflow_dispatch:   # Also allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data fetch
        run: python fetch_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json monthly_snapshots.json
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

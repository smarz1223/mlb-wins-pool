name: Nightly Data Refresh

on:
  schedule:
    # 11:30 UTC = 7:30 AM EDT (Mar-Nov). GitHub cron is UTC only, so in winter (EST)
    # this same line runs at 6:30 AM ET. Minute :30 (not :00) avoids GitHub's busiest queue.
    - cron: '30 11 * * *'
  workflow_dispatch:   # Also allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data fetch
        run: python fetch_data.py

      # League history is isolated: if the Google Sheet is unreachable this step shows a
      # warning but the live standings above still commit, and the last good history.json stays.
      - name: Refresh league history
        continue-on-error: true
        run: python fetch_history.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json monthly_snapshots.json
          git add history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
